<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>QELORA — workspace</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#101014;--surface:#19191f;--surface2:#22222a;--surface3:#2b2b35;--line:#30303a;--text:#f4f1fa;--muted:#a6a3b0;--purple:#b69cff;--purple2:#8b69ee;--good:#8bd8b0;--bad:#ff9b9b;--r:22px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit;border:0}.app{max-width:1440px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:252px 1fr}.side{height:100dvh;position:sticky;top:0;padding:24px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;background:#121216}.brand{display:flex;align-items:center;gap:12px;padding:4px 10px;font-weight:800;font-size:22px;letter-spacing:.08em}.logo{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;overflow:hidden;flex:0 0 38px}
.logo img{width:100%;height:100%;object-fit:contain;display:block}.navlabel{font-size:11px;color:#777482;text-transform:uppercase;letter-spacing:.13em;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{background:transparent;text-align:left;padding:11px 12px;border-radius:13px;color:var(--muted);display:flex;gap:12px;align-items:center}.nav button.active,.nav button:hover{background:#292433;color:#eee6ff}.nav .ico{width:21px;text-align:center;font-size:17px}.sidebottom{margin-top:auto}.main{min-width:0;padding:26px clamp(16px,3vw,42px) 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.eyebrow{color:var(--muted);font-size:13px}.h1{font-size:clamp(26px,4vw,36px);font-weight:750;letter-spacing:-.04em;margin:4px 0}.topright{display:flex;gap:9px;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#302745;color:#d9caff;display:grid;place-items:center;font-weight:700}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:19px;min-width:0}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.statlabel{color:var(--muted);font-size:13px}.stat{font-size:30px;font-weight:750;letter-spacing:-.04em;margin:8px 0 2px}.statnote{color:var(--muted);font-size:12px}.cardtitle{font-size:16px;font-weight:700;margin:0 0 14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.btn{background:var(--purple);color:#211633;padding:10px 15px;border-radius:13px;font-weight:700}.btn.secondary{background:var(--surface3);color:var(--text)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}.btn.small{padding:7px 11px;font-size:13px}.muted{color:var(--muted)}.modulegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.module{padding:15px;background:var(--surface2);border:1px solid var(--line);border-radius:17px;text-align:left;min-height:104px}.module b{display:block;margin:10px 0 3px}.module small{color:var(--muted)}.module .mi{font-size:21px}.list{display:grid;gap:9px}.listitem{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.listitem:last-child{border:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--purple)}.field{width:100%;background:#111116;border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--text);outline:none}.field:focus{border-color:var(--purple2)}textarea.field{min-height:110px;resize:vertical}.formrow{display:flex;gap:9px;margin:12px 0}.formrow>*{flex:1;min-width:0}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 18px;gap:12px}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#332b45;color:#d7c7ff}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.tabs button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted)}.tabs button.active{background:#302640;color:#eee5ff;border-color:#59477b}.auth{max-width:430px;margin:8vh auto;padding:25px}.auth h2{font-size:27px;margin:0 0 5px}.auth p{color:var(--muted)}.auth .field{margin:7px 0}.mobilebar{display:none}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#302640;border:1px solid #5a477d;padding:11px 16px;border-radius:14px;z-index:9;box-shadow:0 10px 40px #0008}.hidden{display:none!important}.progress{height:7px;border-radius:99px;background:#34323c;overflow:hidden}.progress i{display:block;height:100%;background:var(--purple);border-radius:99px}.chatlog{display:grid;gap:10px;max-height:48vh;overflow:auto;margin:14px 0}.bubble{padding:12px 14px;border-radius:15px;background:var(--surface2);max-width:88%;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#382d4d}.smalltext{font-size:12px;color:var(--muted)}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:19px 15px 100px}.mobilebar{display:flex;position:fixed;z-index:8;bottom:0;left:0;right:0;background:#17171d;border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom));justify-content:space-around}.mobilebar button{background:transparent;color:var(--muted);font-size:10px;display:grid;gap:3px;justify-items:center}.mobilebar button.active{color:var(--purple)}.mobilebar span{font-size:19px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.modulegrid{grid-template-columns:repeat(2,1fr)}.top{margin-bottom:22px}.topright .pill{display:none}}
@media(min-width:851px) and (max-width:1100px){.span3{grid-column:span 6}.span4{grid-column:span 6}}
</style>

<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const SB_URL="https://rsqomimtwvkzpgwcxmfm.supabase.co";
const SB_KEY="sb_publishable_Xmzv-KGUR5AC4fXFXO4d7A_dzutwsTe";
const db=window.supabase?.createClient(SB_URL,SB_KEY);
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--tg-bg',tg.themeParams?.bg_color||'#101014')}
const modules=[
['AI Center','✦','Чат, код, разбор ошибок'],['Генераторы','✧','Идеи, ТЗ, структура продукта'],['Каталог инструментов','▦','AI, IDE, конструкторы и хостинг'],
['CRM','◎','Контакты, сделки и касания'],['Финансы','₽','Доходы, расходы и баланс'],['Трекер','◷','Задачи, фокус и прогресс'],['Академия','⌁','Уроки, практика и roadmap'],['Мои проекты','▣','Проекты и рабочие заметки']];
let user=null, page='Главная', tasks=[], contacts=[], deals=[], tx=[], chat=[], generatorText='', activeTab='Все';
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function nav(){return [['Главная','⌂'],...modules.map(x=>[x[0],x[1]])].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span class="ico">${i}</span>${n}</button>`).join('')}
function shell(content){$('#root').innerHTML=`<div class="app"><aside class="side"><div class="brand"><div class="logo"><img src="/assets/qelora-logo.png" alt="QELORA"></div>QELORA</div><div><div class="navlabel">Рабочее пространство</div><div class="nav">${nav()}</div></div><div class="sidebottom"><div class="navlabel">Аккаунт</div><div class="nav"><button onclick="go('Профиль')"><span class="ico">◉</span>Профиль и настройки</button><button onclick="signOut()"><span class="ico">↪</span>Выйти</button></div></div></aside><main class="main"><header class="top"><div><div class="eyebrow">QELORA / workspace</div><div class="h1">${esc(page)}</div></div><div class="topright"><span class="pill">${user?'Подключено к Supabase':'Локальный режим'}</span><div class="avatar">${esc((user?.email||tg?.initDataUnsafe?.user?.first_name||'Q').slice(0,1).toUpperCase())}</div></div></header>${content}</main></div><nav class="mobilebar">${[['Главная','⌂'],['AI Center','✦'],['CRM','◎'],['Трекер','◷'],['Профиль','◉']].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}</nav>`}
function dashboard(){return `<div class="grid">
<div class="card span3"><div class="statlabel">Активные задачи</div><div class="stat">${tasks.filter(x=>x.status!=='done').length}</div><div class="statnote">В твоём трекере</div></div>
<div class="card span3"><div class="statlabel">Контакты CRM</div><div class="stat">${contacts.length}</div><div class="statnote">В твоей базе клиентов</div></div>
<div class="card span3"><div class="statlabel">Доходы</div><div class="stat">${money(tx.filter(x=>x.transaction_type==='income').reduce((a,x)=>a+Number(x.amount),0))}</div><div class="statnote">Всего записано</div></div>
<div class="card span3"><div class="statlabel">Сделки</div><div class="stat">${deals.length}</div><div class="statnote">Воронка продаж</div></div>
<div class="card span8"><div class="sectionhead"><h3 class="cardtitle">Рабочее пространство</h3><span class="badge">QELORA</span></div><div class="modulegrid">${modules.map(([n,i,d])=>`<button class="module" onclick="go('${n}')"><span class="mi">${i}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div></div>
<div class="card span4"><h3 class="cardtitle">Ближайшие задачи</h3>${tasks.slice(0,5).map(taskRow).join('')||'<div class="empty">Пока задач нет</div>'}<button class="btn secondary small" style="margin-top:12px" onclick="go('Трекер')">Открыть трекер</button></div>
<div class="card span12"><div class="row"><div><h3 class="cardtitle" style="margin:0">Быстрый старт</h3><div class="smalltext">Выбери модуль и начни работу</div></div><button class="btn small" onclick="go('AI Center')">Открыть AI Center</button></div></div>
</div>`}
function money(n){return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n)+' ₽'}
function taskRow(t){return `<div class="listitem"><span class="dot" style="background:${t.status==='done'?'var(--good)':t.priority==='high'?'var(--bad)':'var(--purple)'}"></span><div style="flex:1"><b>${esc(t.title)}</b><div class="smalltext">${esc(t.status||'todo')} · ${esc(t.priority||'medium')}</div></div><button class="btn ghost small" onclick="toggleTask('${t.id}')">${t.status==='done'?'↶':'✓'}</button></div>`}
function pageTasks(){return `<div class="grid"><div class="card span8"><div class="sectionhead"><h3 class="cardtitle">Мои задачи</h3><div class="tabs">${['Все','В работе','Готово'].map(x=>`<button class="${activeTab===x?'active':''}" onclick="activeTab='${x}';go('Трекер')">${x}</button>`).join('')}</div></div>${tasks.filter(t=>activeTab==='Все'||(activeTab==='Готово'?t.status==='done':t.status!=='done')).map(taskRow).join('')||'<div class="empty">Добавь первую задачу</div>'}</div><div class="card span4"><h3 class="cardtitle">Новая задача</h3><input id="taskTitle" class="field" placeholder="Например, собрать лендинг"><div class="formrow"><select id="taskPriority" class="field"><option value="medium">Обычный приоритет</option><option value="high">Высокий</option><option value="low">Низкий</option></select></div><button class="btn" onclick="addTask()">Добавить задачу</button><p class="smalltext">Задачи сохраняются в Supabase после входа, иначе — локально на устройстве.</p></div></div>`}
function pageCRM(){return `<div class="grid"><div class="card span4"><h3 class="cardtitle">Новый контакт</h3><input id="cName" class="field" placeholder="Имя / компания"><input id="cPhone" class="field" style="margin-top:9px" placeholder="Телефон или мессенджер"><input id="cNote" class="field" style="margin-top:9px" placeholder="Заметка"><button class="btn" style="margin-top:12px" onclick="addContact()">Сохранить контакт</button></div><div class="card span8"><div class="sectionhead"><h3 class="cardtitle">Контакты</h3><span class="badge">${contacts.length}</span></div>${contacts.map(c=>`<div class="listitem"><div class="avatar">${esc(c.name.slice(0,1).toUpperCase())}</div><div style="flex:1"><b>${esc(c.name)}</b><div class="smalltext">${esc(c.phone||'Контакт')} ${c.notes?'· '+esc(c.notes):''}</div></div></div>`).join('')||'<div class="empty">Контактов пока нет</div>'}</div></div>`}
function pageFinance(){let income=tx.filter(x=>x.transaction_type==='income').reduce((a,x)=>a+Number(x.amount),0),expense=tx.filter(x=>x.transaction_type==='expense').reduce((a,x)=>a+Number(x.amount),0);return `<div class="grid"><div class="card span4"><div class="statlabel">Доходы</div><div class="stat">${money(income)}</div></div><div class="card span4"><div class="statlabel">Расходы</div><div class="stat">${money(expense)}</div></div><div class="card span4"><div class="statlabel">Баланс</div><div class="stat">${money(income-expense)}</div></div><div class="card span4"><h3 class="cardtitle">Добавить операцию</h3><select id="txType" class="field"><option value="income">Доход</option><option value="expense">Расход</option></select><input id="txAmount" class="field" style="margin-top:9px" type="number" min="1" placeholder="Сумма ₽"><input id="txCat" class="field" style="margin-top:9px" placeholder="Категория"><button class="btn" style="margin-top:12px" onclick="addTx()">Сохранить</button></div><div class="card span8"><h3 class="cardtitle">История операций</h3>${tx.map(x=>`<div class="listitem"><div style="flex:1"><b>${esc(x.category)}</b><div class="smalltext">${esc(x.transaction_date||'')}</div></div><b style="color:${x.transaction_type==='income'?'var(--good)':'var(--bad)'}">${x.transaction_type==='income'?'+':'−'}${money(x.amount)}</b></div>`).join('')||'<div class="empty">Операций пока нет</div>'}</div></div>`}
function pageAI(){return `<div class="grid"><div class="card span8"><div class="row"><h3 class="cardtitle">AI-диалог</h3><span class="badge">Демо-интерфейс</span></div><div class="chatlog" id="chatlog">${chat.map(m=>`<div class="bubble ${m.role}">${esc(m.content)}</div>`).join('')||'<div class="empty">Напиши задачу — QELORA подготовит структуру запроса. Для реальных ответов подключи AI-провайдера в серверной функции.</div>'}</div><textarea id="prompt" class="field" placeholder="Опиши, что нужно создать или исправить…"></textarea><div class="row" style="margin-top:10px"><span class="smalltext">Вывод сохраняется локально в этой сессии</span><button class="btn" onclick="sendPrompt()">Подготовить запрос</button></div></div><div class="card span4"><h3 class="cardtitle">Возможности AI Center</h3>${['Генерация кода','Поиск и исправление ошибок','Объяснение кода','Рефакторинг','Работа с файлами','История диалогов','Выбор AI-модели'].map(x=>`<div class="listitem"><span class="dot"></span>${x}</div>`).join('')}<p class="smalltext">AI API-ключ нельзя хранить в браузере. Нужен Edge Function или собственный backend.</p></div></div>`}
const genKinds=['Идея стартапа','Техническое задание','Название продукта','Структура сайта','Структура приложения','Концепция Telegram-бота','UI/UX-концепция','Бизнес-модель','Промпт для AI','Шаблон документа'];
function pageGenerators(){return `<div class="grid"><div class="card span5"><h3 class="cardtitle">Генератор</h3><select id="genKind" class="field">${genKinds.map(x=>`<option>${x}</option>`).join('')}</select><textarea id="genInput" class="field" style="margin-top:10px" placeholder="Опиши нишу, продукт, аудиторию и ограничения…"></textarea><button class="btn" style="margin-top:10px" onclick="generateText()">Сформировать задание</button></div><div class="card span7"><h3 class="cardtitle">Готовый промпт</h3><div id="genOutput" class="empty">Результат появится здесь</div><button class="btn secondary small" style="margin-top:10px" onclick="copyGen()">Скопировать</button></div></div>`}
function pageTools(){let data=[['AI-модели','ChatGPT','Генерация и анализ текста','https://chatgpt.com'],['AI-модели','Claude','Работа с большими контекстами','https://claude.ai'],['AI-модели','Gemini','Мультимодальный AI','https://gemini.google.com'],['Конструкторы','v0','Генерация интерфейсов','https://v0.app'],['Конструкторы','Lovable','Создание приложений','https://lovable.dev'],['IDE','Cursor','AI-редактор кода','https://cursor.com'],['Хостинг','Vercel','Деплой веб-приложений','https://vercel.com'],['База данных','Supabase','Postgres, Auth, Storage','https://supabase.com'],['Дизайн','Figma','UI/UX-дизайн','https://figma.com']];return `<div class="card"><div class="sectionhead"><h3 class="cardtitle">Каталог инструментов</h3><span class="badge">${data.length} подборок</span></div><div class="modulegrid">${data.map(x=>`<a class="module" href="${x[3]}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit"><span class="badge">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></a>`).join('')}</div><p class="smalltext">Это стартовый каталог. Рейтинги, цены и отзывы пока не подключены.</p></div>`}
function pageAcademy(){let lessons=[['Основы vibe coding','Как формулировать задачу для AI',20],['Работа с GitHub','Репозиторий, commit и ветки',35],['Supabase','База данных, Auth и RLS',45],['Публикация','Деплой и домен',30]];return `<div class="grid"><div class="card span8"><h3 class="cardtitle">Траектория обучения</h3>${lessons.map((l,i)=>`<div class="listitem"><div class="avatar">${i+1}</div><div style="flex:1"><b>${l[0]}</b><div class="smalltext">${l[1]} · ${l[2]} мин</div></div><span class="badge">План</span></div>`).join('')}</div><div class="card span4"><h3 class="cardtitle">Твой прогресс</h3><div class="stat">0%</div><div class="progress"><i style="width:0%"></i></div><p class="smalltext">Прогресс будет сохраняться в learning_progress после подключения уроков.</p></div></div>`}
function pageProjects(){return `<div class="card"><h3 class="cardtitle">Мои проекты</h3><div class="empty">Создание проектов будет подключено следующим этапом. База user_projects уже готова.</div></div>`}
function pageProfile(){return `<div class="grid"><div class="card span6"><h3 class="cardtitle">Профиль</h3><div class="listitem"><div class="avatar">${esc((user?.email||'Q').slice(0,1).toUpperCase())}</div><div><b>${esc(user?.email||tg?.initDataUnsafe?.user?.first_name||'Гость')}</b><div class="smalltext">${user?'Supabase Auth':'Telegram WebApp / локальный режим'}</div></div></div><p class="smalltext">Роль, навыки, био и язык интерфейса будут доступны после входа.</p><button class="btn secondary" onclick="signOut()">Выйти</button></div><div class="card span6"><h3 class="cardtitle">Подключения</h3><div class="listitem">Supabase <span class="badge">Подключено</span></div><div class="listitem">Telegram Mini App <span class="badge">${tg?'Открыто в Telegram':'Ожидает запуска в Telegram'}</span></div><div class="listitem">AI-провайдер <span class="badge">Не подключён</span></div><p class="smalltext">Telegram identity нельзя безопасно принимать из initDataUnsafe на клиенте. Нужна серверная проверка подписи initData.</p></div></div>`}
function go(p){page=p;render()}
function render(){let c=page==='Главная'?dashboard():page==='Трекер'?pageTasks():page==='CRM'?pageCRM():page==='Финансы'?pageFinance():page==='AI Center'?pageAI():page==='Генераторы'?pageGenerators():page==='Каталог инструментов'?pageTools():page==='Академия'?pageAcademy():page==='Мои проекты'?pageProjects():pageProfile();shell(c)}
async function loadData(){if(!user||!db)return;try{let [a,b,c,d]=await Promise.all([db.from('tasks').select('*').order('created_at',{ascending:false}),db.from('crm_contacts').select('*').order('created_at',{ascending:false}),db.from('crm_deals').select('*').order('created_at',{ascending:false}),db.from('finance_transactions').select('*').order('transaction_date',{ascending:false})]);if(!a.error)tasks=a.data||[];if(!b.error)contacts=b.data||[];if(!c.error)deals=c.data||[];if(!d.error)tx=d.data||[];render()}catch(e){toast('Не удалось загрузить данные')}}
async function addTask(){let title=$('#taskTitle')?.value.trim();if(!title)return toast('Введи название задачи');let item={title,status:'todo',priority:$('#taskPriority').value};if(user){let {data,error}=await db.from('tasks').insert({...item,user_id:user.id}).select().single();if(error)return toast(error.message);tasks.unshift(data)}else tasks.unshift({...item,id:crypto.randomUUID()});render();toast('Задача добавлена')}
async function toggleTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;let status=t.status==='done'?'todo':'done';if(user){let {error}=await db.from('tasks').update({status,completed_at:status==='done'?new Date().toISOString():null}).eq('id',id);if(error)return toast(error.message)}t.status=status;render()}
async function addContact(){let name=$('#cName').value.trim();if(!name)return toast('Укажи имя контакта');let item={name,phone:$('#cPhone').value,notes:$('#cNote').value};if(user){let {data,error}=await db.from('crm_contacts').insert({...item,user_id:user.id}).select().single();if(error)return toast(error.message);contacts.unshift(data)}else contacts.unshift({...item,id:crypto.randomUUID()});render();toast('Контакт сохранён')}
async function addTx(){let amount=Number($('#txAmount').value),category=$('#txCat').value.trim();if(!(amount>0)||!category)return toast('Укажи сумму и категорию');let item={transaction_type:$('#txType').value,amount,category};if(user){let {data,error}=await db.from('finance_transactions').insert({...item,user_id:user.id}).select().single();if(error)return toast(error.message);tx.unshift(data)}else tx.unshift({...item,id:crypto.randomUUID(),transaction_date:new Date().toISOString().slice(0,10)});render();toast('Операция сохранена')}
function sendPrompt(){let v=$('#prompt').value.trim();if(!v)return;chat.push({role:'user',content:v},{role:'assistant',content:'Запрос подготовлен. Для генерации реального ответа подключи AI-провайдера через защищённую серверную функцию. Не вставляй API-ключ в этот HTML.'});render()}
function generateText(){let kind=$('#genKind').value, brief=$('#genInput').value.trim();if(!brief)return toast('Добавь описание задачи');generatorText=`Ты — опытный продуктовый специалист и senior-разработчик.\n\nЗадача: ${kind}\n\nКонтекст:\n${brief}\n\nСформируй результат на русском языке. Уточни допущения, предложи конкретную структуру, этапы реализации, критерии готовности и риски. Не выдумывай интеграции и не скрывай ограничения.`;$('#genOutput').textContent=generatorText}
function copyGen(){if(!generatorText)return toast('Сначала сформируй промпт');navigator.clipboard?.writeText(generatorText).then(()=>toast('Скопировано')).catch(()=>toast('Не удалось скопировать'))}
async function signOut(){if(user&&db)await db.auth.signOut();user=null;tasks=[];contacts=[];tx=[];render()}
function authScreen(){ $('#root').innerHTML=`<div class="auth card"><div class="brand" style="padding:0 0 20px"><div class="logo"><img src="/assets/qelora-logo.png" alt="QELORA"></div>QELORA</div><h2>Твоё пространство для разработки</h2><p>Войди, чтобы синхронизировать проекты, задачи, CRM и финансы.</p><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Пароль"><button class="btn" style="width:100%;margin-top:10px" onclick="emailAuth('in')">Войти</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="emailAuth('up')">Создать аккаунт</button><div class="formrow"><button class="btn ghost" onclick="oauth('google')">Google</button><button class="btn ghost" onclick="oauth('github')">GitHub</button></div><button class="btn ghost" style="width:100%" onclick="continueGuest()">Продолжить без аккаунта</button><p class="smalltext">Telegram-вход подключается через серверную проверку initData. Кнопка ниже откроет бота.</p><button class="btn ghost" style="width:100%" onclick="window.open('https://t.me/qelora_app_bot','_blank')">Открыть Telegram-бота</button></div>`}
async function emailAuth(mode){let email=$('#email').value,password=$('#password').value;if(!email||password.length<6)return toast('Нужен email и пароль от 6 символов');let r=mode==='in'?await db.auth.signInWithPassword({email,password}):await db.auth.signUp({email,password});if(r.error)return toast(r.error.message);user=r.data.user;if(user){await loadData();render()}else toast('Проверь почту для подтверждения')}
async function oauth(provider){let {error}=await db.auth.signInWithOAuth({provider,options:{redirectTo:location.origin}});if(error)toast(error.message)}
function continueGuest(){user=null;render()}
async function boot(){if(!db){authScreen();return}let {data}=await db.auth.getSession();user=data.session?.user||null;db.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;if(user)loadData();else render()});if(user){await loadData();render()}else if(tg?.initDataUnsafe?.user){continueGuest()}else authScreen()}
boot();
</script></body></html>
